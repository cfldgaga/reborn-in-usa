name: Daily site watch

on:
  schedule:
    # 06:17 UTC daily (off-peak minute to dodge top-of-hour congestion)
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check both wheel-game pages
        run: |
          set -u
          fail=0
          for url in \
            "https://cfldgaga.github.io/reborn-in-usa/" \
            "https://cfldgaga.github.io/reborn-in-china/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')  $url  ->  HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code (expected 200)"
              fail=1
            fi
          done
          exit $fail
